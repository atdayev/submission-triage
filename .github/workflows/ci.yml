name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint also runs govet + staticcheck + errcheck, so they aren't
      # separate steps. install-mode goinstall compiles the linter from source
      # with this job's Go toolchain, so it can analyze a module whose go
      # directive is newer than a prebuilt release's build Go.
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

      - name: build
        run: go build ./...

      # vet the tagged files too: they are excluded from the default build, so a
      # signature change that breaks them compiles clean until someone runs the tag
      - name: vet (tagged builds)
        run: |
          go vet -tags integration ./...
          go vet -tags stress ./...

      - name: test (race)
        run: go test -race -count=1 ./...

      # in-memory IMAP/SMTP servers; no network or credentials needed
      - name: test (integration)
        run: go test -race -count=1 -tags integration ./...

      # real SQLite + real concurrency. -race matters most here: this is the only
      # suite that drives the reply pool and the outbox sweeper against each other
      - name: test (stress)
        run: go test -race -count=1 -tags stress -timeout 15m ./...
